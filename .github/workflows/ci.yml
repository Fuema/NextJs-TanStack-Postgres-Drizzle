name: Continuous Integration Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Typecheck Verification (npx tsc --noEmit)
        run: npm run typecheck

      - name: Run Vitest Unit Test Suite
        run: npm test

      - name: Production Bundle Verification
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_sample"
          CLERK_SECRET_KEY: "sk_test_sample"
